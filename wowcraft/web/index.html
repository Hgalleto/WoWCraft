<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoWCraft · Forever Talent Forge</title>
<link rel="icon" href="assets/icons/inv_misc_book_07.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: an armory "character plate" header, racial strip, then tabbed workbench (Talents / Gear / Sheet / Builds). Deliberately single dark theme: parchment-gold on night stone, accent shifts with faction. */
:root{
  color-scheme: dark;
  --bg:#0c0a08; --stone:#15110d; --panel:#1b1611; --panel2:#241d16; --well:#100d0a;
  --line:#3b2f21; --line-hi:#6b5431;
  --gold:#e0b95c; --gold-dim:#9a7a3a; --ink:#ece2cc; --muted:#a8987b; --faint:#6f634f;
  --green:#4fd16a; --red:#e0574a; --amber:#f0a83a;
  --acc:#4e7fe0; --acc-deep:#1b2f5c; /* Alliance default; Horde overrides below */
  --cls:#e0b95c;
  --f-display:"Cinzel", "Trajan Pro", Georgia, serif;
  --f-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --tile:46px; --gap:14px;
}
body[data-faction="Horde"]{ --acc:#d1453a; --acc-deep:#4f1712; }
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 500px at 50% -120px, color-mix(in srgb, var(--acc-deep) 70%, transparent), transparent 70%),
  radial-gradient(900px 600px at 100% 100%, #1a120a, transparent 70%);
  background-attachment:fixed; min-height:100%;}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.04em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-display);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Framed panel: double hairline like a tooltip frame */
.frame{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:6px;position:relative;
  box-shadow:inset 0 0 0 1px #00000088, inset 0 1px 0 #ffffff0a, 0 10px 30px #0008}
.frame::before{content:"";position:absolute;inset:3px;border:1px solid #ffffff08;border-radius:4px;pointer-events:none}

/* Buttons */
.btn{appearance:none;border:1px solid var(--line-hi);background:linear-gradient(180deg,#3a2c1a,#21180f);color:var(--gold);
  font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:4px;cursor:pointer;
  box-shadow:inset 0 1px 0 #ffffff1a, 0 2px 0 #000;transition:filter .15s, transform .05s}
.btn:hover{filter:brightness(1.2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#8a1d14,#4e0d08);border-color:#c0392b;color:#ffe9b0}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line);color:var(--muted)}
.btn.small{padding:6px 10px;font-size:11px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}

/* ---------- Character plate ---------- */
.plate{display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;padding:18px 20px;overflow:hidden}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, color-mix(in srgb,var(--acc) 22%, transparent), transparent 45%);pointer-events:none;border-radius:6px}
.crest{width:84px;height:84px;position:relative;z-index:1}
.crest svg{width:100%;height:100%}
.plate-main{min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.charname{font-size:clamp(24px,4vw,38px);font-weight:900;color:var(--ink);text-shadow:0 2px 0 #000, 0 0 24px #0008;line-height:1.05;overflow-wrap:anywhere}
.charline{font-family:var(--f-display);font-size:15px;letter-spacing:.06em;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.charline .cls{color:var(--cls);font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line-hi);color:var(--gold)}
.pill.fac{border-color:var(--acc);color:#fff;background:color-mix(in srgb,var(--acc) 35%, transparent)}
.pill.warn{border-color:var(--amber);color:var(--amber)}
.plate-side{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.lvl{display:flex;align-items:center;gap:8px}
.lvl input{width:62px;text-align:center}
.specline{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* Editor form */
.editor{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;align-items:end;padding:18px 20px;position:relative;z-index:1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-family:var(--f-display);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim)}
input[type=text],input[type=number],select,textarea{background:var(--well);border:1px solid var(--line);border-radius:4px;padding:8px 10px;color:var(--ink);width:100%;min-width:0;box-shadow:inset 0 2px 4px #0008}
input:disabled,select:disabled{opacity:.55}
textarea{font-family:var(--f-mono);font-size:12px;min-height:90px;resize:vertical}
.faction-toggle{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--well)}
.faction-toggle button{border:0;background:transparent;padding:8px 6px;cursor:pointer;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;color:var(--muted)}
.faction-toggle button[aria-pressed="true"][data-f="Alliance"]{background:linear-gradient(180deg,#2b4f9e,#162a57);color:#fff}
.faction-toggle button[aria-pressed="true"][data-f="Horde"]{background:linear-gradient(180deg,#9e2b22,#561510);color:#fff}
.faction-toggle button:disabled{cursor:not-allowed}
.editor-actions{display:flex;gap:10px;flex-wrap:wrap;grid-column:1/-1;align-items:center}
.note{font-size:13px;color:var(--muted)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--amber);border-radius:4px;background:#2a1d08;color:#f7d59b;font-size:14px}

/* ---------- Racials ---------- */
.racials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.racial{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.racial h3{font-size:14px;color:var(--gold)}
.racial .desc{font-size:13.5px;color:var(--ink);opacity:.9}
.racial .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid}
.tag.active{color:#9fd0ff;border-color:#3a6ea8}
.tag.passive{color:#c9b98d;border-color:#6b5a36}
.tag.src{color:var(--amber);border-color:#7a5413}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.switch input{accent-color:var(--gold)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{appearance:none;border:1px solid var(--line);border-bottom:0;background:linear-gradient(180deg,#1f1912,#130f0b);padding:10px 18px;border-radius:6px 6px 0 0;cursor:pointer;
  font-family:var(--f-display);font-weight:700;letter-spacing:.1em;font-size:13px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--gold);background:linear-gradient(180deg,#352817,#1b1611);border-color:var(--line-hi)}
.panel{display:flex;flex-direction:column;gap:16px}

/* ---------- Talents ---------- */
.tbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:12px 16px}
.points{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.points b{font-family:var(--f-mono);font-size:22px;color:var(--gold)}
.trees{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tree{padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.tree-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.tree-head h3{font-size:17px;color:var(--ink)}
.tree-head .tp{font-family:var(--f-mono);color:var(--gold);font-size:15px}
.tree-role{font-size:12.5px;color:var(--muted);position:relative;z-index:1;margin-top:-6px}
.tree-bg{position:absolute;inset:0;opacity:.22;pointer-events:none}
.grid-wrap{position:relative;margin:0 auto;z-index:1}
.tgrid{display:grid;grid-template-columns:repeat(4,var(--tile));grid-auto-rows:var(--tile);gap:var(--gap);position:relative}
.tgrid svg.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.tal{position:relative;border-radius:6px;cursor:pointer;border:2px solid #4a4a4a;background:#222;padding:0;
  box-shadow:inset 0 0 0 1px #000, 0 2px 4px #000c;transition:transform .08s, box-shadow .15s;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.tal .ic{position:absolute;inset:0;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 2px #000;filter:grayscale(1) brightness(.5)}
.tal .rk{position:absolute;right:-8px;bottom:-8px;background:#0a0a0a;border:1px solid #555;border-radius:4px;font-family:var(--f-mono);font-size:10.5px;padding:0 4px;line-height:15px;color:#aaa;font-weight:600}
.tal.avail{border-color:var(--green);box-shadow:inset 0 0 0 1px #000, 0 0 10px #4fd16a55}
.tal.avail .ic,.tal.has .ic{filter:none}
.tal.avail .rk{color:var(--green);border-color:#2f7a3e}
.tal.has{border-color:var(--green)}
.tal.has .rk{color:var(--green);border-color:#2f7a3e}
.tal.max{border-color:var(--gold);box-shadow:inset 0 0 0 1px #000, 0 0 12px #e0b95c66}
.tal.max .rk{color:var(--gold);border-color:var(--gold-dim)}
.tal.sel{transform:scale(1.08);z-index:2}
.tal .flag{position:absolute;left:-4px;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--amber);border:1px solid #000}
.tal .flag.unk{background:var(--red)}
.tree-foot{display:flex;justify-content:flex-end;position:relative;z-index:1}

.inspector{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.insp-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.insp-body h3{font-size:17px;color:var(--ink)}
.insp-rank{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.insp-text{color:#ffd100;font-size:14.5px}
.insp-next{font-size:14px}
.insp-next b{color:var(--ink);font-weight:500}
.insp-req{color:var(--red);font-size:13.5px}
.insp-btns{display:flex;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid #000}

/* hover tooltip (WoW-style) */
.tip{position:fixed;z-index:50;max-width:320px;background:linear-gradient(180deg,#0b1020f2,#060914f2);border:1px solid #6d7aa3;border-radius:5px;padding:10px 12px;pointer-events:none;
  box-shadow:0 8px 24px #000c;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.tip h4{margin:0;font-size:15px;color:#fff;font-family:var(--f-body);font-weight:700}
.tip .r{color:#ccc;font-family:var(--f-mono);font-size:11.5px}
.tip .t{color:#ffd100}
.tip .n{color:#ccc}
.tip .q{color:#ff4040}
.tip .s{color:var(--amber);font-size:12px}
.tip .h{color:#5ec8ff;font-size:12px}

/* ---------- Gear ---------- */
.gear{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
.slots{padding:8px;display:flex;flex-direction:column;gap:2px}
.slot{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 8px;border-radius:4px;border:1px solid transparent;background:transparent;text-align:left;cursor:pointer;min-width:0}
.slot:hover{background:#ffffff08}
.slot[aria-current="true"]{border-color:var(--line-hi);background:#ffffff0d}
.slot .sq{width:28px;height:28px;border-radius:4px;border:1px solid #555;background:#111;display:grid;place-items:center;font-family:var(--f-display);font-size:10px;color:var(--faint)}
.slot.filled .sq{border-color:#a335ee;color:#d9b3ff;background:#1d1028}
.slot .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.slot .nm small{display:block;color:var(--faint);font-size:11px;font-family:var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.slot .sm{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ged{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.statgrid .field input{text-align:right;font-family:var(--f-mono)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect h3{font-size:14px;color:var(--gold);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
details.frame{padding:12px 16px}
details summary{cursor:pointer;font-family:var(--f-display);color:var(--gold);letter-spacing:.06em}
details[open] summary{margin-bottom:12px}

/* ---------- Sheet ---------- */
.sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:14px;color:var(--gold)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.good{color:var(--green)} .bad{color:var(--red)} .mid{color:var(--amber)}
.roles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.role{padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer;text-align:left}
.role .v{font-family:var(--f-mono);font-size:24px;color:var(--ink);font-weight:600}
.role .u{font-size:12px;color:var(--muted)}
.role.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px #000, 0 0 0 1px var(--gold-dim), 0 10px 30px #0008}
.role.on .v{color:var(--gold)}
.weights{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;font-size:13.5px}
.wbar{height:10px;background:#0006;border-radius:2px;overflow:hidden;border:1px solid #0008}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold))}
.wrow .mono{text-align:right}
.formula{font-size:13px;color:var(--muted);columns:2 320px;column-gap:28px}
.formula p{margin:0 0 8px;break-inside:avoid}
.formula b{color:var(--ink);font-weight:500}

/* ---------- Builds ---------- */
.builds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:5px;background:#0003;min-width:0}
.bitem .nm{min-width:0}
.bitem .nm b{display:block;font-family:var(--f-display);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitem .nm small{color:var(--muted);font-size:12.5px}
.bitem .act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #000}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px}
.cmp th,.cmp td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted)}
.cmp thead th{font-family:var(--f-display);color:var(--gold);font-size:12.5px;letter-spacing:.06em}
.cmp td{font-family:var(--f-mono)}
.cmp td.best{color:var(--green);font-weight:600}
.rank-bars{display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1c150d;border:1px solid var(--gold-dim);color:var(--gold);padding:10px 16px;border-radius:5px;z-index:60;font-family:var(--f-display);letter-spacing:.06em;box-shadow:0 8px 30px #000}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}

/* ---- real artwork ---- */
.tree{background:#0b0906}
.tree-bg{opacity:1;background-size:cover;background-position:center top;filter:saturate(.9)}
.tree-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0008 0%,#0004 30%,#000a 100%)}
.tal{border-color:#3a3a3a;background:#000;overflow:visible}
.tal img{position:absolute;inset:0;width:100%;height:100%;border-radius:4px;filter:grayscale(1) brightness(.45);display:block;max-width:none}
.tal.avail img,.tal.has img,.tal.max img{filter:none}
.tal::after{content:"";position:absolute;inset:0;border-radius:4px;box-shadow:inset 0 0 0 1px #0009, inset 0 0 8px #000a;pointer-events:none}
.tal.active-ab{border-radius:50% 50% 6px 6px / 22% 22% 6px 6px}
.tal .st{position:absolute;left:-7px;top:-7px;font-family:var(--f-display);font-weight:900;font-size:9.5px;line-height:15px;width:15px;text-align:center;border-radius:3px;border:1px solid #000;color:#000;z-index:1}
.st.new{background:#4fd16a}.st.changed{background:#f0a83a}.st.moved{background:#6fb7ff}
.legend .k{display:inline-block;font-family:var(--f-display);font-weight:900;font-size:9.5px;line-height:14px;width:14px;text-align:center;border-radius:3px;color:#000;margin-right:5px;vertical-align:middle}
.tree-head img{width:26px;height:26px;border-radius:4px;border:1px solid #000;box-shadow:0 0 0 1px var(--line-hi)}
.tree-head .tn{display:flex;align-items:center;gap:8px}
.tip .cost{color:#fff;font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 12px}
.tip .cl{color:#9aa4bd;font-size:12px;border-top:1px solid #ffffff1a;padding-top:4px;margin-top:2px}
.badge{display:inline-block;font-size:10.5px;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;padding:0 5px;border-radius:3px;color:#000;margin-right:6px}
.racial .rhead{display:flex;gap:10px;align-items:center}
.racial .rhead img{width:38px;height:38px;border-radius:5px;border:1px solid #000;box-shadow:0 0 0 1px var(--line-hi);flex:none}
.crest.portrait{position:relative}
.crest.portrait .ci{width:100%;height:100%;border-radius:10px;border:2px solid var(--gold-dim);box-shadow:0 0 0 2px #000, 0 6px 18px #000c;display:block}
.crest.portrait .ri{position:absolute;right:-10px;bottom:-10px;width:44%;height:44%;border-radius:50%;border:2px solid var(--acc);box-shadow:0 0 0 2px #000}
.classgrid{display:flex;flex-wrap:wrap;gap:6px}
.classgrid button{width:44px;height:44px;padding:0;border-radius:6px;border:2px solid #333;background:#000;cursor:pointer;position:relative}
.classgrid button img{width:100%;height:100%;border-radius:4px;display:block}
.classgrid button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 10px #e0b95c88}
.classgrid button:disabled{opacity:.25;cursor:not-allowed}
.insp-head{display:flex;gap:12px;align-items:center}
.insp-head img{width:48px;height:48px;border-radius:6px;border:1px solid #000;box-shadow:0 0 0 1px var(--line-hi)}
.cr-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
/* ---- armory (gear tab) ---- */
.armory{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:16px;align-items:start}
.doll{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.3fr) minmax(150px,1fr);grid-template-rows:auto auto;gap:10px;padding:14px;

/* how many levels above you the target is (0 = same level, 3 = raid boss); older saves stored an absolute level */
function targetDiff(state){ const st=state.settings||{}; if(st.tdiff!=null) return Math.max(0,Math.min(3,+st.tdiff)); if(st.target) return Math.max(0,Math.min(3,+st.target-60)); return 3; }
function targetLevel(state){ return Math.min(63,(+state.char.level||60)+targetDiff(state)); }
function armorConstant(T){ const a=FSTATS&&FSTATS.armorConstant; return (a&&(a[T]||a[String(T)]))||400+85*T; }

function compute(state, delta){
  const c=CLS[state.char.cls]; const E=effectTotals(state); const G=gearSum(state); const B=baseFor(state);
  const e=k=>E[k]||0; const lvl=+state.char.level||60;
  if(delta) for(const k in delta) G[k]=(G[k]||0)+delta[k];
  const P={};
  PRIMARY.forEach(k=>{ P[k]=(B[k]+G[k])*(1+(e(k+"_pct")+e("all_stats_pct"))/100); });
  const out={P};
  // pools
  const sta=P.sta, int=P.int;
  out.hp=(B.hp + Math.min(sta,20) + Math.max(sta-20,0)*B.hpPerSta + G.hp)*(1+e("health_pct")/100);
  out.mana=B.mana>0 ? (B.mana + Math.min(int,20) + Math.max(int-20,0)*15)*(1+e("mana_pct")/100) + G.mana : 0;
  out.armor=(G.armor*(1+e("armor_items_pct")/100) + P.agi*2)*(1+e("armor_pct")/100);
  // attack power
  const FC=fClass(state.char.cls);
  const apBase=P.str*FC.apPerStr + P.agi*FC.apPerAgi + B.apOff;
  out.ap=(apBase + G.ap + int*e("ap_from_int_pct")/100)*(1+e("ap_pct")/100);
  const rapBase=FC.rapPerAgi>0 ? P.agi*FC.rapPerAgi + B.rapOff : 0;
  out.rap=(rapBase + G.rap)*(1+e("rap_pct")/100);
  // crit / hit
  out.mcrit=B.critBase + P.agi*B.critPerAgi + G.crit + e("melee_crit");
  out.rcrit=B.critBase + P.agi*B.critPerAgi + G.crit + e("ranged_crit");
  out.scrit=B.scritPerInt>0? B.scritBase + int*B.scritPerInt + G.scrit + G.crit + e("spell_crit") : 0; // Forever: gear crit counts for spells too
  out.mhit=G.hit + e("melee_hit"); out.rhit=G.hit + e("ranged_hit"); out.shit=G.shit + G.hit + e("spell_hit");
  out.sp=(G.sp + int*e("spellpower_from_int_pct")/100 + P.spi*e("spellpower_from_spi_pct")/100)*(1+e("sp_pct")/100);
  out.healPow=out.sp + G.heal*(1+e("sp_pct")/100);
  out.spDmg=out.sp + G.spd*(1+e("sp_pct")/100);
  // defense
  const def=lvl*5+G.def; const defBonus=(G.def)*0.04; out.def=def;
  out.dodge=B.dodgeBase + P.agi*B.dodgePerAgi + G.dodge + e("dodge") + defBonus;
  out.parry=c.parry? 5 + G.parry + e("parry") + defBonus : 0;
  const hasShield=slotView(state,"Off Hand").wtype==="Shield";
  out.block=c.block&&hasShield? 5 + G.block + e("block") + defBonus : 0;
  out.bv=hasShield? (G.bv + P.str/20)*(1+e("block_value_pct")/100) : 0;
  out.missTaken=5+defBonus;
  // regen
  const tick=c.reg[1]? c.reg[0] + P.spi/c.reg[1] : 0;
  out.spiMp5=tick*2.5; out.mp5=G.mp5 + e("mp5");
  out.regenIdle=out.mp5 + out.spiMp5; out.regenCast=out.mp5 + out.spiMp5*e("casting_regen_pct")/100;
  // target tables
  const T=targetLevel(state); const diff=targetDiff(state);
  // Forever beta client: never miss a raid boss (+3) at 8% melee/ranged, 17% spells, 27% dual wield; same level 5% / 4% / 24%
  const dd=Math.max(0,Math.min(3,diff));
  const missY=[5,6,7,8][dd], missDW=[24,25,26,27][dd], tdodge=5+dd*0.5, glance=dd>=3?40:10+dd*10, glancePen=dd>=3?0.35:0.05+dd*0.1;
  const sMiss=[4,5,6,17][dd];
  // ----- melee
  const mh=slotView(state,"Main Hand"), oh=slotView(state,"Off Hand");
  const twoH=TWO_HAND.has(mh.wtype);
  const wpn=(w)=>{ const mn=+w.wmin||0,mx=+w.wmax||0,sp=+w.wspd||0; return sp>0&&mx>0?{avg:(mn+mx)/2,spd:sp}:null; };
  const MH=wpn(mh)||{avg:1.5,spd:2.0};
  const OHw=(c.dw && oh && !["Shield","Held In Off-hand","—",undefined,""].includes(oh.wtype)) ? wpn(oh) : null;
  const dmgMult=1+(e("phys_dmg_pct")+e("melee_dmg_pct")+(twoH?e("twohand_dmg_pct"):e("onehand_dmg_pct")))/100;
  const haste=1+(e("attack_speed_pct")+G.haste)/100;
  const critMult=2*(1+e("crit_dmg_bonus_pct")/100);
  const white=(w,isOH,miss)=>{ if(!w) return 0;
    const hitDmg=(w.avg + out.ap/14*w.spd)*(isOH?0.5*(1+e("offhand_dmg_pct")/100):1);
    const m=Math.max(0,miss-out.mhit)/100, d=tdodge/100, g=glance/100;
    const cr=Math.max(0,Math.min(out.mcrit/100,1-m-d-g));
    const avg=g*(1-glancePen)+cr*2+Math.max(0,1-m-d-g-cr);
    return hitDmg*avg/w.spd*haste; };
  const wMH=white(MH,false,OHw?missDW:missY), wOH=white(OHw,true,missDW);
  const yHit=(MH.avg + out.ap/14*MH.spd); const ym=Math.max(0,missY-out.mhit)/100, yd=tdodge/100;
  const yAvg=(1-ym-yd)*(1 + Math.min(out.mcrit/100,1)*(critMult-1));
  const yellow=yHit/MH.spd*yAvg*(c.abil-1);
  out.meleeDps=(wMH+wOH+yellow)*dmgMult;
  // ----- ranged
  const rg=slotView(state,"Ranged / Relic"); const RW=["Bow","Gun","Crossbow","Thrown"].includes(rg.wtype)||!rg.wtype?wpn(rg):null;
  if(c.rap!=="none" && RW){
    const m=Math.max(0,missY-out.rhit)/100; const cr=Math.min(out.rcrit/100,1-m);
    const per=(RW.avg + out.rap/14*RW.spd)*((1-m)+cr*(critMult-1));
    const mult=1+(e("phys_dmg_pct")+e("ranged_dmg_pct"))/100;
    const pet=state.char.cls==="Hunter"? 110*(1+e("pet_dmg_pct")/100) : 0;
    out.rangedDps=per/RW.spd*(c.rabil||1)*mult + pet;
  } else out.rangedDps=0;
  // ----- spell
  const dom=dominantTree(state);
  const sp=(SPELL[state.char.cls]&&(SPELL[state.char.cls][dom]||SPELL[state.char.cls].find(Boolean)))||DEFAULT_SPELL[state.char.cls]||null;
  out.spellName=sp?sp.n:null;
  if(sp){
    const cast=sp.cast/(1+e("cast_speed_pct")/100);
    const hit=1-Math.max(0,sMiss-out.shit)/100;
    const cm=0.5*(1+e("spell_crit_dmg_bonus_pct")/100);
    const mult=1+(e("spell_dmg_pct")+e(sp.s+"_dmg_pct"))/100;
    out.spellDps=(sp.avg+(out.spDmg+(G["sp_"+sp.s]||0))*sp.co)*mult*hit*(1+Math.min(out.scrit,100)/100*cm)/cast;
    const burn=sp.m/cast - out.regenCast/5; out.spellOom=burn>0? out.mana/burn : Infinity;
  } else { out.spellDps=0; out.spellOom=0; }
  // ----- healing
  const h=HEAL[state.char.cls]; out.healName=h?h.n:null;
  if(h){
    out.hps=(h.avg+out.healPow*h.co)*(1+e("healing_pct")/100)*(1+Math.min(out.scrit,100)/100*0.5)/h.cast;
    const burn=h.m/h.cast - out.regenCast/5; out.healOom=burn>0? out.mana/burn : Infinity;
  } else { out.hps=0; out.healOom=0; }
  // ----- tank
  const armorDR=Math.min(0.75, out.armor/(out.armor+armorConstant(T)));
  out.armorDR=armorDR*100;
  out.avoid=out.missTaken+out.dodge+out.parry+out.block;
  const dt=1+e("damage_taken_pct")/100;
  out.ehp=out.hp/((1-armorDR)*dt);
  out.critImmune=(G.def>=140);
  out.tank=out.ehp*(1+Math.min(out.avoid,70)/100)/1000;
  out.spiritRegenNote=tick;
  out.E=E; out.G=G; out.B=B;
  return out;
}
function dominantTree(state){
  const sp=specOf(state); if(sp!==null) return sp;
  const cd=classData(state.char.cls); let best=0,bv=-1;
  cd.trees.forEach((t,i)=>{ const p=t.talents.reduce((a,x)=>a+(state.talents[x.id]||0),0); if(p>bv){bv=p;best=i;} });
  return best;
}
function roleOf(state){
  if(state.settings.role && state.settings.role!=="auto") return state.settings.role;
  return (TREE_ROLE[state.char.cls]||["melee"])[dominantTree(state)];
}
const METRIC={melee:o=>o.meleeDps, ranged:o=>o.rangedDps, spell:o=>o.spellDps, heal:o=>o.hps, tank:o=>o.tank};
function rolesFor(cls){
  const set=new Set(["melee"]); if(CLS[cls].rap!=="none") set.add("ranged");
  if(SPELL[cls]||DEFAULT_SPELL[cls]) set.add("spell"); if(HEAL[cls]) set.add("heal"); if(CLS[cls].parry||CLS[cls].block||cls==="Druid") set.add("tank");
  if(cls==="Mage"||cls==="Warlock"||cls==="Priest") set.delete("melee");
  return ["melee","ranged","spell","heal","tank"].filter(r=>set.has(r));
}
function statWeights(state, role){
  const f=METRIC[role]; const base=f(compute(state)); if(!base) return [];
  const probes=[["str",10],["agi",10],["sta",10],["int",10],["spi",10],["ap",20],["sp",12],["heal",22],["crit",1],["hit",1],["scrit",1],["shit",1],["mp5",4],["armor",100],["def",10],["dodge",1]];
  return probes.map(([k,d])=>{ const v=f(compute(state,{[k]:d}))-base; return {k,d,v}; }).filter(x=>x.v>1e-6);
}

/* ================== Specialization + recommended builds ================== */
let SPEC_BUILDS={builds:{}};
function specOf(state){ const s=state.char.spec; return (s===0||s===1||s===2)?s:null; }
function specName(state,ti){ const t=classData(state.char.cls).trees[ti]; return t?t.name:""; }
function withState(st,fn){ const keep=S; S=st; try{ return fn(); } finally { S=keep; } }
/* load the recommended Forever build for a spec, then fit it to the character's level */
function applySpecBuild(state,ti){
  return withState(state,()=>{
    const cd=classData(S.char.cls), tree=cd.trees[ti]; if(!tree) return false;
    const b=((SPEC_BUILDS.builds||{})[S.char.cls]||{})[tree.name];
    S.talents=b?{...b.talents}:{};
    const all=allTalents(S.char.cls);
    // top up to 51 (a couple of popular builds leave points unspent): main tree first, then the others
    let guard=200;
    while(spent()<51 && guard--){
      const opts=all.filter(t=>canAddIgnoringLevel(t)).sort((a,b)=>(a.ti===ti?0:1)-(b.ti===ti?0:1)||(b.effects&&b.effects.length?1:0)-(a.effects&&a.effects.length?1:0)||a.tier-b.tier);
      if(!opts.length) break; S.talents[opts[0].id]=(S.talents[opts[0].id]||0)+1;
    }
    trimForSpec(ti);
    return !!b;
  });
}
function canAddIgnoringLevel(t){ const r=S.talents[t.id]||0; if(r>=t.max) return false; if(treePoints(t.ti)<(t.tier-1)*5) return false;
  if(t.req){ const p=talentMap(S.char.cls)[t.req]; if(p&&(S.talents[p.id]||0)<p.max) return false; } return true; }
/* below level 60: give back support-tree points first, then the deepest points of the main tree */
function trimForSpec(ti){
  let guard=300;
  while(spent()>totalPoints() && guard--){
    const all=allTalents(S.char.cls).filter(t=>(S.talents[t.id]||0)>0&&canRemove(t));
    if(!all.length) break;
    all.sort((a,b)=>(a.ti===ti?1:0)-(b.ti===ti?1:0)||b.tier-a.tier);
    const t=all[0]; S.talents[t.id]--; if(!S.talents[t.id]) delete S.talents[t.id];

}
function specBuildNote(state,ti){
  const t=classData(state.char.cls).trees[ti]; const b=t&&((SPEC_BUILDS.builds||{})[state.char.cls]||{})[t.name];
  return b?`Most-used complete ${t.name} build on talentsforever.com (${b.pts.join("/")}), ${SPEC_BUILDS.window||"Forever beta"}`:"No published Forever build for this spec yet";

/* ================== Profession planner: judged on the class and spec at level 60 ================== */
const PLAN={cache:{},running:false,tier:"pre"};

function planState(spec,prof){
  const st={...JSON.parse(JSON.stringify(S)),example:false};

/* gear a planning character; with `from`, start from that outfit so each slot only changes when the total improves */
function outfit(st,from){
  const role=roleOf(st); AUTO_NO_RAID=PLAN.tier==="pre";

  try{ withState(st,()=>{ autoEquip(role,!!from); autoEquip(role,true); autoEnchant(role); }); } finally { AUTO_NO_RAID=false; }
  return METRIC[role](compute(st));
}
async function runPlan(spec,onStep){
  const key=planKey(spec); if(PLAN.cache[key]&&PLAN.cache[key].done) return PLAN.cache[key];
  const res=PLAN.cache[key]={spec,role:null,base:0,rows:{},done:false};
  const base=planState(spec,""); res.role=roleOf(base); res.base=outfit(base); res.baseGear=base.gear; res.baseEnch=base.enchants;
  for(const p of CRAFT.primary||[]){
    await new Promise(r=>setTimeout(r,0));
    const st=planState(spec,p); const v=Math.max(res.base,outfit(st,base));
    const unlocks=[];
    for(const sl of SLOTS){
      const a=(st.gear[sl]||{}).id, b=(base.gear[sl]||{}).id;
      if(a&&a!==b){ const it=ITEM_BY_ID[a]; if(it&&!itemAvail(it,base).ok) unlocks.push(`${it.n} (${sl})`); }
      const ea=st.enchants[sl], eb=base.enchants[sl];
      if(ea&&ea!==eb){ const en=ENCH_BY_ID[ea]; if(en&&!enchantSources(en,base).length) unlocks.push(`${enchantText(en)} on ${sl}`); }
    }
    // best-in-slot pieces and enchants (available to anyone) that this profession could make itself
    const makes=[];
    for(const sl of SLOTS){ const it=itemFor(base,sl); if(it&&it.cr&&it.cr.p===p) makes.push(it.n);
      const en=ENCH_BY_ID[base.enchants[sl]]; if(en&&(en.src||[]).some(x=>(x.k==="enchanter"&&p==="Enchanting")||(x.k==="item"&&x.p===p))) makes.push(enchantText(en)+" ("+sl+")"); }
    res.rows[p]={d:unlocks.length?v-res.base:0,unlocks,makes};   // gains with nothing profession-only are just optimiser noise

}
function planUnit(role){ return role==="tank"?"":role==="heal"?" HPS":" DPS"; }
function renderPlanner(el){

  const draw=()=>{

    const cur=R[sel];
    const rows=(CRAFT.primary||[]).map(p=>{ const x=cur&&cur.rows[p]; return {p,d:x?x.d:null,unlocks:x?x.unlocks:[],makes:x?x.makes||[]:[]}; }).sort((a,b)=>(b.d??-1e9)-(a.d??-1e9)||b.makes.length-a.makes.length);
    const top=Math.max(0.01,...rows.map(r=>r.d||0));
    const pending=R.some(r=>!r||!r.done);
    el.innerHTML=`<div class="plan-head"><h3>Which professions help a ${esc(specName(S,sel))} ${esc(S.char.cls)} most?</h3>
      <div class="seg" role="tablist" aria-label="Gear level">${[["pre","Pre-raid gear"],["raid","Full raid gear"]].map(([k,l])=>`<button role="tab" data-tier="${k}" aria-selected="${PLAN.tier===k}">${l}</button>`).join("")}</div></div>
      <div class="note">Judged for the class and spec as a whole, not your current level or gear: a level 60 ${esc(RACE_NAME[S.char.race]||"")} ${esc(S.char.cls)} with the recommended ${esc(specName(S,sel))} build, wearing the best ${PLAN.tier==="pre"?"pre-raid gear (item level 65 and below: dungeons, quests, crafting, reputation, PvP below rank 12)":"gear including raid drops and top PvP rewards"} and enchants it could get with no profession, then again with each profession. The number is how much that profession's soulbound crafts, profession-only items and self-only enchants add. ${pending?"<b>Working it out…</b>":""}</div>
      <div class="pf-rank pf-plan"><div class="pf-r pf-head"><span></span><span></span><span class="lbl">${esc(specName(S,sel))}</span>${trees.map((t,i)=>`<span class="lbl ${i===sel?"on":""}">${esc(t.name)}</span>`).join("")}</div>
      ${rows.map(r=>`<div class="pf-r ${hasProf(r.p)?"mine":""}"><img src="${IICON(PROF_ICON[r.p])}" alt=""><div class="pf-rn"><b>${esc(r.p)}${hasProf(r.p)?" · yours":""}</b><small>${r.d==null?"…":r.unlocks.length?"Unlocks "+esc(r.unlocks.slice(0,3).join(" · ")):r.makes.length?`No stat gain, but you'd make ${r.makes.length} of your best pieces yourself: ${esc(r.makes.slice(0,3).join(" · "))}${r.makes.length>3?"…":""}`:GATHERING.has(r.p)?"No gear of its own; gathers materials and saves gold":"Nothing it unlocks beats what's available without it"}</small></div>
        <div class="wbar"><i style="width:${Math.max(1,(r.d||0)/top*100)}%"></i></div>
        ${trees.map((t,i)=>{ const x=R[i]&&R[i].rows[r.p]; return `<span class="mono ${i===sel?"on":""}">${x?(x.d>0.05?"+"+x.d.toFixed(1):"0")+`<small>${planUnit(R[i].role)}</small>`:"…"}</span>`; }).join("")}</div>`).join("")}</div>`;

/* ================== Professions: data, availability rules, enchants, consumables ================== */
let CRAFT={primary:[],secondary:[],specs:{},enchants:[],consumables:[],temps:[]}, ENCH_BY_ID={}, CONS_BY_ID={}, TEMP_BY_ID={};
const PROF_ICON={Alchemy:"trade_alchemy",Blacksmithing:"trade_blacksmithing",Enchanting:"trade_engraving",Engineering:"trade_engineering",Leatherworking:"trade_leatherworking",
  Tailoring:"trade_tailoring",Herbalism:"spell_nature_naturetouchgrow",Mining:"trade_mining",Skinning:"inv_misc_pelt_wolf_01",Cooking:"inv_misc_food_15","First Aid":"spell_holy_sealofsacrifice",Fishing:"trade_fishing"};
const GATHERING=new Set(["Herbalism","Mining","Skinning"]);
function profState(state){ state=state||S; if(!state.prof) state.prof={p1:"",p2:"",sec:{},spec:{}}; state.prof.sec=state.prof.sec||{}; state.prof.spec=state.prof.spec||{}; return state.prof; }
function hasProf(name,state){ const p=profState(state); return p.p1===name||p.p2===name||!!p.sec[name]; }
function hasSpec(spec,state){ const p=profState(state); return Object.values(p.spec).includes(spec); }
function specProf(spec){ for(const [p,l] of Object.entries(CRAFT.specs||{})) if(l.includes(spec)) return p; return null; }

/* Can this character get this item?  Returns {ok, how, why} */
function itemAvail(it,state){
  state=state||S;
  const fac=state.char.faction==="Horde"?"h":"a";
  if(it.fx && it.fx!==fac){
    const other=it.fx==="h"?"Horde":"Alliance";
    if(it.b!==2) return {ok:false,why:`${other} only: ${state.char.faction} characters can't get it`};
  }
  for(const r of it.req||[]){
    if(r.spec){ const pp=specProf(r.n); if(pp && !(hasProf(pp,state)&&hasSpec(r.n,state))) return {ok:false,why:`Requires ${r.n}`}; }
    else if(!hasProf(r.n,state)) return {ok:false,why:`Requires ${r.n}${r.r?` (${r.r})`:""} to equip`};
  }
  if(it.cr){
    const mine=hasProf(it.cr.p,state);
    if(it.bop && !mine) return {ok:false,why:`Soulbound: only ${it.cr.p} can make it for themselves`};
    return {ok:true,how:mine?`You craft it (${it.cr.p})`:`Buy or trade (crafted by ${it.cr.p}, Bind on Equip)`};
  }
  if(it.fx && it.fx!==fac) return {ok:true,how:`${it.fx==="h"?"Horde":"Alliance"} item: Bind on Equip, so buy it on the neutral auction house`};
  return {ok:true,how:""};
}
/* Enchant sources this character can actually use */
function enchantSources(en,state){
  state=state||S; const out=[];
  if(en.needs && !hasProf(en.needs.n,state)) return out;
  for(const s of en.src||[]){
    if(s.k==="enchanter") out.push(hasProf("Enchanting",state)?"You enchant it yourself":"An enchanter applies it");
    else{
      if(s.needs && !hasProf(s.needs.n,state)) continue;
      if(s.bop && s.p && !hasProf(s.p,state)) continue;
      out.push(s.p ? (hasProf(s.p,state)?`You make ${s.n}`:`Buy ${s.n} (${s.p})`) : `Use ${s.n}`);
    }
  }
  return [...new Set(out)];
}
function enchantFits(en,it){
  const r=en.rule; if(!r||!it) return false;
  if(r.c!==it.c) return false;
  if(r.inv>0 && !(r.inv & (1<<it.inv))) return false;
  if(r.sub>0 && !(r.sub & (1<<it.sc))) return false;
  return true;
}
function enchantOn(state,slot,it){
  const id=state.enchants&&state.enchants[slot]; if(!id) return null;
  const en=ENCH_BY_ID[id]; if(!en||!it||!enchantFits(en,it)) return null;
  return en;
}
function enchantText(en){ return en.n.replace(/^Enchant: /,""); }
/* Temporary weapon enhancements (sharpening stones, weightstones, oils, poisons, shaman imbues, imbue scrolls).
   They don't touch the permanent enchant: a weapon can have one enchant AND one temporary enhancement.
   A new temporary one replaces the old temporary one. */
const TEMP_SLOTS=new Set(["Main Hand","Off Hand"]);
const TEMP_KIND={stone:"Stone",oil:"Oil",poison:"Poison",imbue:"Shaman imbue",other:"Scroll / coating"};
function tempFits(t,it){ return !!t && !!it && enchantFits(t,it); }
function tempAvail(t,state){
  state=state||S;
  if(t.cls && !t.cls.includes(state.char.cls)) return {ok:false,why:`${t.cls.join(", ")} only`};

}
function tempOn(state,slot,it){
  if(!TEMP_SLOTS.has(slot)) return null;

/* One enchantment per item. Enchants, armor kits, spikes, scopes, arcanums and shoulder enchants all share

function applyEnchant(slot,id){

/* drop gear, enchants or consumables the character can no longer obtain */
function cleanupUnavailable(){
  const removed=[];
  for(const sl of SLOTS){
    const it=itemFor(S,sl);
    if(it && (!itemAvail(it).ok||!canUse(it,S))){ removed.push(it.n); S.gear[sl]={}; }
    const eid=S.enchants&&S.enchants[sl];
    if(eid){ const en=ENCH_BY_ID[eid]; if(!en||!enchantSources(en).length){ removed.push(en?enchantText(en):"enchant"); delete S.enchants[sl]; } }
    const tid=S.temps&&S.temps[sl];
    if(tid!=null){ const t=TEMP_BY_ID[tid]; if(!t||(t.cls&&!t.cls.includes(S.char.cls))){ removed.push(t?t.n:"temporary enhancement"); delete S.temps[sl]; } }
  }
  S.cons=(S.cons||[]).filter(id=>{ const c=CONS_BY_ID[id]; const ok=c&&consAvail(c).ok; if(!ok&&c) removed.push(c.n); return ok; });
  if(removed.length) toast(`Removed ${removed.length} item${removed.length>1?"s":""} you can no longer get or use`);
}
function consAvail(c,state){
  if(c.bop && !hasProf(c.p,state)) return {ok:false,why:`Soulbound: only ${c.p} can make it`};
  return {ok:true,how:hasProf(c.p,state)?`You make it (${c.p})`:`Buy or trade (${c.p})`};
}

/* ---------- Professions & Crafting tab ---------- */
function slotsForItem(it){ return SLOTS.filter(sl=>(SLOT_INV[sl]||[]).includes(it.inv)); }
function bestGainFor(prof){
  // value of adding `prof`: best new item per slot + best new enchant per slot that only this profession unlocks
  const role=roleOf(S), f=METRIC[role];
  const without=S, withP=JSON.parse(JSON.stringify(S)); const pp=profState(withP);
  if(!pp.p1) pp.p1=prof; else if(!pp.p2&&pp.p1!==prof) pp.p2=prof; else pp.p2=prof;
  const base=f(compute(S)); const picks=[];
  const lvl=+S.char.level||60;
  for(const sl of SLOTS){
    if(sl==="Shirt"||sl==="Tabard") continue;
    let best=null;
    for(const it of slotCandidates(sl,S)){
      if(it.lv>lvl||!canUse(it,S)) continue;
      if(!(it.cr&&it.cr.p===prof)&&!(it.req||[]).some(r=>r.n===prof||specProf(r.n)===prof)) continue;
      if(!itemAvail(it,withP).ok||itemAvail(it,without).ok) continue;
      const keep=S.gear[sl]; S.gear[sl]={id:it.id}; const d=f(compute(S))-base; S.gear[sl]=keep;
      if(d>0.05&&(!best||d>best.d)) best={d,n:it.n,sl,id:it.id,kind:"item"};
    }
    const cur=itemFor(S,sl);
    if(cur) for(const en of CRAFT.enchants){
      if(!enchantFits(en,cur)) continue;
      if(!enchantSources(en,withP).length||enchantSources(en,without).length) continue;
      const keep=(S.enchants||{})[sl]; S.enchants=S.enchants||{}; S.enchants[sl]=en.id; const d=f(compute(S))-base; if(keep) S.enchants[sl]=keep; else delete S.enchants[sl];
      if(d>0.05&&(!best||d>best.d)) best={d,n:enchantText(en),sl,id:en.id,kind:"enchant"};
    }
    if(best) picks.push(best);
  }
  picks.sort((a,b)=>b.d-a.d);
  const exclusive=ITEMS.filter(it=>it.cr&&it.cr.p===prof&&canUse(it,S)&&slotsForItem(it).length&&itemAvail(it,withP).ok&&!itemAvail(it,without).ok).length;
  return {prof,total:picks.reduce((a,p)=>a+p.d,0),picks,exclusive};
}

function canUse(it,state){
  const cls=state.char.cls;
  if(it.cl && !it.cl.includes(cls)) return false;
  if(it.rc && !it.rc.includes(RACE_NAME[state.char.race])) return false;
  if(it.wpn){ if(!(WEAPON_OK[cls]||[]).includes(it.t)) return false; }
  else if(it.t && it.t!=="Miscellaneous" && !(ARMOR_OK[cls]||[]).includes(it.t)) return false;
  return true;
}
function slotCandidates(slot,state){
  const inv=SLOT_INV[slot]||[]; const c=CLS[state.char.cls]||{};
  return ITEMS.filter(it=>{
    if(!inv.includes(it.inv)) return false;
    if(slot==="Off Hand" && it.inv===13 && !c.dw) return false;
    if(slot==="Ranged / Relic" && it.t==="Wand" && !(WEAPON_OK[state.char.cls]||[]).includes("Wand")) return false;
    return true;
  });
}
function statLine(it,max=4){
  const st=it.st||{}; const out=[];
  if(it.w) out.push(`${(((it.w.min+it.w.max)/2)/it.w.spd).toFixed(1)} DPS`);
  for(const k of ["str","agi","sta","int","spi","sp","heal","spd","ap","rap","crit","hit","mp5","def","dodge","parry","block","bv"]){
    if(st[k]) out.push(/%/.test(STAT_SHORT[k])?`${st[k]}${STAT_SHORT[k]}`:`+${st[k]} ${STAT_SHORT[k]}`);
  }
  return out.slice(0,max).join(" · ");
}

function autoEnchant(role){

const store={db:null,uid:null,mode:"local",list:[],unsub:null};
async function initStore(){
  if(API.ok){ try{ store.list=(await API.get("builds")).builds; store.mode="files"; }catch(e){ readLocalBuilds(); } }
  else readLocalBuilds();

}
function readLocalBuilds(){ store.mode="local"; try{ store.list=JSON.parse(localStorage.getItem("wowcraft.builds")||"[]"); }catch(e){ store.list=[]; } }
function writeLocalBuilds(){ try{ localStorage.setItem("wowcraft.builds",JSON.stringify(store.list)); }catch(e){} }
function snapshotBuild(name){
  const o=compute(S); const role=roleOf(S);
  return {kind:"build",name,savedAt:Date.now(),role,score:METRIC[role](o),
    summary:{spec:classData(S.char.cls).trees.map((t,i)=>treePoints(i)).join("/"),hp:Math.round(o.hp),mana:Math.round(o.mana)},
    state:JSON.parse(JSON.stringify({...S,example:false}))};
}
async function saveBuild(name){
  const b=snapshotBuild(name);
  if(store.mode==="files"){ try{ const saved=await API.send("builds","POST",b); store.list.unshift(saved); toast("Build saved to WoWCraft\\builds"); render(); return; }catch(e){ toast("Couldn't save to disk. Is WoWCraft still running?"); return; } }
  store.list.unshift({id:"b"+b.savedAt,...b}); writeLocalBuilds(); toast("Build saved in this browser"); render();
}
async function deleteBuild(id){
  if(store.mode==="files"){ try{ await API.send("builds/"+encodeURIComponent(id),"DELETE"); store.list=store.list.filter(b=>b.id!==id); ui.compare=ui.compare.filter(x=>x!==id); toast("Build deleted"); render(); return; }catch(e){ toast("Couldn't delete the build file."); return; } }
  store.list=store.list.filter(b=>b.id!==id); ui.compare=ui.compare.filter(x=>x!==id); writeLocalBuilds(); render();
}
function loadBuild(b){ S=JSON.parse(JSON.stringify(b.state)); S.v=3; ui.sel=null; ui.editing=false; ui.tab="talents"; commit(); toast(`Loaded “${b.name}”`); }
function encodeBuild(){ return btoa(unescape(encodeURIComponent(JSON.stringify({wowf:2,state:S})))); }
function decodeBuild(txt){ const o=JSON.parse(decodeURIComponent(escape(atob(txt.trim())))); if(!o||o.wowf!==2||!o.state||!o.state.char) throw new Error("bad"); return o.state; }

/* ================== Updates tab ================== */
const UPD={data:null,timer:null,full:false,busy:false};
function fmtWhen(t){ if(!t) return "Never"; const d=new Date(t*1000); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}); }
async function updFetch(){ try{ UPD.data=await API.get("update"); }catch(e){ UPD.data=null; } }
function updPoll(){
  clearTimeout(UPD.timer);
  if(ui.tab!=="updates") return;
  UPD.timer=setTimeout(async()=>{ const was=UPD.data&&UPD.data.running; await updFetch(); if(ui.tab!=="updates") return; drawUpdates(qs("#view")); if(UPD.data&&UPD.data.running) updPoll(); else if(was) toast("Update finished. Reload WoWCraft to use the new data."); },1500);
}
async function renderUpdates(v){
  v.innerHTML=`<div class="empty">Checking update status…</div>`;
  await updFetch(); drawUpdates(v); if(UPD.data&&UPD.data.running) updPoll();
}
function updReport(res){
  if(!res) return "";
  const steps=Object.values(res.report||{});
  const knownCls=Object.keys(ARMOR_OK);
  const newCls=[]; steps.forEach(st=>{ const g=st.groups.Classes; if(g) g.examples.added.forEach(c=>{ if(!knownCls.includes(c)) newCls.push(c); }); });
  const grp=(name,g)=>{ const n=g.added+g.removed+g.changed;
    const ex=["added","removed","changed"].filter(k=>g.examples[k].length).map(k=>`<div class="upd-ex"><b class="upd-${k}">${k[0].toUpperCase()+k.slice(1)}:</b> ${g.examples[k].map(esc).join(", ")}${g[k]>g.examples[k].length?` <span class="muted">and ${g[k]-g.examples[k].length} more</span>`:""}</div>`).join("");
    return `<div class="upd-grp"><div class="upd-line"><span>${esc(name)}</span><span class="muted">${g.total} total</span>${n?`<span class="upd-added">+${g.added}</span><span class="upd-removed">−${g.removed}</span><span class="upd-changed">~${g.changed}</span>`:`<span class="muted">no changes</span>`}</div>${ex}</div>`; };
  return `<section class="frame card"><h3>${res.ok?"Update finished":"Update finished with problems"} <span class="muted" style="font-family:var(--f-body);letter-spacing:0;font-size:13px">${esc((UPD.data.targets[res.target]||{}).label||res.target)}, ${fmtWhen(res.at)}</span></h3>
    ${(res.errors||[]).map(e=>`<div class="bad">${esc(e)}. The previous data for this part was kept.</div>`).join("")}
    ${newCls.length?`<div class="bad">New class${newCls.length>1?"es":""} found: ${newCls.map(esc).join(", ")}. Talents load, but WoWCraft's armor, weapon and stat rules for ${newCls.length>1?"them":"it"} need an app update.</div>`:""}
    ${steps.map(st=>`<div class="upd-step"><div class="eyebrow">${esc(st.label)}</div>${Object.entries(st.groups).map(([n,g])=>grp(n,g)).join("")}</div>`).join("")||`<div class="muted">Nothing was updated.</div>`}
    <div><button class="btn" id="updReload">Reload WoWCraft to use the new data</button></div></section>`;
}
function drawUpdates(v){
  const D=UPD.data;
  if(!D){ v.innerHTML=`<div class="empty">Updates need the WoWCraft app running. Start it with Launch WoWCraft.bat and open this tab again.</div>`; return; }
  const run=D.running, T=D.targets, st=D.state||{};
  const card=(k,big)=>{ const t=T[k], s=st[k]||{};
    return `<article class="frame card upd-card ${big?"upd-big":""}"><h3>${esc(t.label)}</h3><div class="note">${esc(t.what)}</div>
      ${t.steps.length>1?`<div class="note">Runs: ${t.steps.map(esc).join(" → ")}</div>`:""}
      <div class="upd-meta"><span>Last updated: <b>${fmtWhen(s.at)}</b>${s.via&&s.via!==k?` <span class="muted">(with ${esc((T[s.via]||{}).label||s.via)})</span>`:""}</span>${s.at?`<span>${s.ok===false?`<span class="bad">had problems</span>`:`${s.changes||0} change${s.changes===1?"":"s"}`}</span>`:""}</div>
      <div><button class="btn ${big?"":"small"}" data-upd="${k}" ${run?"disabled":""}>${run&&D.target===k?"Updating…":"Update "+esc(t.label.toLowerCase())}</button></div></article>`; };
  v.innerHTML=`<div class="upd">
    <section class="frame card"><h3>Keep WoWCraft current</h3>
      <div class="note">Forever will keep changing. Each button pulls that part of the data from its source and only processes what changed: new things are added, things Forever no longer has are removed, and changed things are replaced. Nothing is duplicated. Tooltips, icons and art already on your PC are reused. Your saved builds aren't touched; gear that's removed from Forever simply shows as empty.</div>
      <div class="upd-ver">${Object.entries(D.versions||{}).map(([k,x])=>`<span><small>${esc(k)}</small><b>${esc(x)}</b></span>`).join("")}</div>
      <label class="switch" title="Gear that ForeverDB players haven't seen in Forever and that isn't in Forever's own client data (like a crafting recipe) is inactive: hidden and not counted. Tick to show it anyway."><input type="checkbox" id="updUnconf" ${showUnconfirmed()?"checked":""}> Show gear not yet confirmed in Forever (${ALL_ITEMS.length-ALL_ITEMS.filter(i=>i.ok).length} items)</label>
      <label class="switch" title="Ask Wowhead about every item again, not just new or changed ones. Takes much longer."><input type="checkbox" id="updFull" ${UPD.full?"checked":""} ${run?"disabled":""}> Full re-check of every item (slow)</label>
    </section>
    ${card("everything",true)}
    <div class="upd-grid">${["talents","items","crafting","sources","stats"].map(k=>card(k)).join("")}</div>
    ${run||(D.log&&D.log.length&&!D.result)?`<section class="frame card"><h3>${run?"Working…":"Log"}</h3><pre class="upd-log" id="updLog">${esc((D.log||[]).join("\n"))}</pre></section>`:""}
    ${!run?updReport(D.result):""}
    ${!run&&D.result&&D.log&&D.log.length?`<details class="frame"><summary>Update log</summary><pre class="upd-log">${esc(D.log.join("\n"))}</pre></details>`:""}
  </div>`;
  const lg=qs("#updLog"); if(lg) lg.scrollTop=lg.scrollHeight;
  const f=qs("#updFull"); if(f) f.onchange=()=>{ UPD.full=f.checked; };
  const uc=qs("#updUnconf"); if(uc) uc.onchange=()=>{ try{ localStorage.setItem("wowcraft.showUnconfirmed",uc.checked?"1":"0"); }catch(e){} applyConfirmed(); PLAN.cache={}; renderPlate(); toast(uc.checked?"Unconfirmed gear is now shown":"Only gear confirmed in Forever is shown"); };
  const rl=qs("#updReload"); if(rl) rl.onclick=()=>location.reload();
  v.querySelectorAll("[data-upd]").forEach(b=>b.onclick=async()=>{
    if(UPD.busy) return; UPD.busy=true;
    try{ const r=await fetch("api/update/"+b.dataset.upd,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full:UPD.full})});
      if(r.status===409) toast("An update is already running"); else if(!r.ok) toast("Couldn't start the update");
    }catch(e){ toast("Couldn't reach WoWCraft. Is it still running?"); }
    UPD.busy=false; await updFetch(); drawUpdates(v); updPoll();
  });
}

/* ================== Boot ================== */
(async function boot(){
  try{ DATA=await (await fetch("game.json")).json(); }catch(e){ document.getElementById("view").innerHTML='<div class="empty">Talent data is missing. Close WoWCraft and run it again while online to download it.</div>'; return; }
  racesList().forEach(r=>{ if(r.classes&&r.classes.length) CLASSES_BY_RACE[r.id]=r.classes; });
  try{ const IJ=await (await fetch("items.json")).json(); ALL_ITEMS=IJ.items||[]; ALL_ITEMS.forEach(it=>{ ITEM_BY_ID[it.id]=it; it.lv=it.rl||1; }); applyConfirmed(); }catch(e){ ITEMS=[]; }
  try{ FSTATS=await (await fetch("forever_stats.json")).json(); }catch(e){ FSTATS=null; }
  try{ SPEC_BUILDS=await (await fetch("spec_builds.json")).json(); }catch(e){ SPEC_BUILDS={builds:{}}; }
  try{ CRAFT=await (await fetch("crafting.json")).json(); CRAFT.enchants.forEach(en=>ENCH_BY_ID[en.id]=en); CRAFT.consumables.forEach(c=>CONS_BY_ID[c.id]=c); (CRAFT.temps=CRAFT.temps||[]).forEach(t=>TEMP_BY_ID[t.id]=t); }catch(e){}
  let saved=null;
  try{ const ping=await API.get("ping"); API.ok=!!ping.ok; }catch(e){ API.ok=false; }
  if(API.ok){ try{ const c=await API.get("current"); if(c&&c.v===3) saved=c; }catch(e){} }
  await loadCalib();
  if(saved&&saved.baseOverride&&saved.char&&saved.char.cls){ // older versions stored typed-in base stats; keep them as a saved sheet
    const ov=saved.baseOverride, k=`${saved.char.cls}|${raceDataKey(saved.char.race,saved.char.faction)}`, L=+saved.char.level||60, rec={};
    ["str","agi","sta","int","spi","hp"].forEach(x=>{ if(ov[x]!=null&&isFinite(ov[x])) rec[x]=ov[x]; });
    if(Object.keys(rec).length){ CALIB[k]=CALIB[k]||{}; CALIB[k][L]=Object.assign(rec,CALIB[k][L]||{}); await saveCalib(); }
    saved.baseOverride=null;
  }
  S=saved||load()||exampleState();
  if(S.example && S.char.cls==="Paladin" && !Object.keys(S.talents).length){ if(!applySpecBuild(S,0)) seedExampleTalents(); }
  if(S.example && ITEMS.length && !SLOTS.some(sl=>(S.gear[sl]||{}).id)){ autoEquip("heal"); autoEnchant("heal"); }
  SLOTS.forEach(sl=>{ if(!S.gear[sl]) S.gear[sl]={}; });
  profState(S); S.enchants=S.enchants||{}; S.cons=S.cons||[];
  try{ const t=localStorage.getItem("wowcraft.tab"); if(t) ui.tab=t; }catch(e){}
  render(); initStore();
})();
function seedExampleTalents(){ // greedy: fill Holy then Retribution, respecting rules, to show a 31/0/20 hybrid
  const cd=classData("Paladin"); if(!cd.trees.length) return;
  const fill=(ti,cap)=>{ let guard=500; while(treePoints(ti)<cap && spent()<totalPoints() && guard--){ const opts=cd.trees[ti].talents.map(t=>Object.assign({ti},t)).filter(t=>canAdd(t).ok).sort((a,b)=>a.tier-b.tier); if(!opts.length) break; S.talents[opts[0].id]=(S.talents[opts[0].id]||0)+1; } };
  fill(0,31); fill(2,20);
}
